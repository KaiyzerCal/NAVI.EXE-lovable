name: Android Build (Capacitor)

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Stamp a unique versionCode
        # android/app/build.gradle carries a hardcoded `versionCode 1`, and CI
        # never changed it — so every APK ever produced was version 1. That is
        # not cosmetic: @capawesome/capacitor-live-update keeps downloaded OTA
        # bundles in the app's data directory, which survives installing a new
        # APK over an old one. With the version indistinguishable, nothing can
        # invalidate a stale bundle, so a freshly installed APK keeps booting
        # into old JS and reinstalling appears to change nothing.
        #
        # Stamping the run number gives each build a distinct, monotonic
        # version that src/lib/liveUpdate.ts compares against to decide whether
        # to reset to the APK's own assets.
        run: |
          set -euo pipefail
          CODE="${{ github.run_number }}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${CODE}\"/" android/app/build.gradle
          grep -nE 'versionCode|versionName' android/app/build.gradle

      - name: Build web assets
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor
        run: npx @capacitor/cli sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # Debug build only — release builds need a signing keystore, added
      # once real Play Store signing credentials exist.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: navi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
