name: Deploy NAVI.EXE Edge Functions
on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
      # Deploys every function directory under supabase/functions instead of
      # a hardcoded list — this workflow only ever covered 4 of the repo's
      # (now 18) functions. Looping over the directory listing means a
      # newly-added function is covered automatically, with nothing to
      # remember to add here.
      - name: Deploy all edge functions
        run: |
          set -euo pipefail
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            if [ "$fn" = "_shared" ]; then continue; fi
            echo "::group::Deploy $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
            echo "::endgroup::"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
