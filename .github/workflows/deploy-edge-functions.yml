name: Deploy NAVI.EXE Edge Functions
on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"
  # Manual trigger with an explicit list. Without this there is no way to
  # redeploy a function whose FILES have not changed — exactly what is
  # needed after adding or rotating an edge-function secret, since a
  # running isolate holds the environment it booted with until replaced.
  # The only alternative was pushing a no-op commit. mythos-vantara's
  # equivalent workflow already takes this input.
  workflow_dispatch:
    inputs:
      functions:
        description: >-
          Space or comma separated function names to deploy. Overrides the
          usual "changed since last push" detection.
        required: false
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth:2 broke silently on any push that lands as a merge
          # commit (e.g. a local `git pull --no-rebase` before pushing,
          # which happens routinely here since Lovable's own background
          # agent also pushes directly to main) — HEAD~1 on a merge commit
          # is just its first parent, which can be identical to HEAD for
          # every file this workflow cares about, so the diff comes back
          # empty and the run "succeeds" having deployed nothing. Confirmed
          # live: a push with real changes to navi-analyze-media and
          # navi-extract-memories deployed zero functions this way, and the
          # bug went unnoticed because the job still exited 0. fetch-depth:0
          # (full history) plus diffing against github.event.before instead
          # of HEAD~1 fixes this regardless of merge topology.
          fetch-depth: 0
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
      # Deploys only the functions whose files actually changed in this
      # push, determined from the diff against the previous commit — not
      # every function directory. This project has a plan-level cap on
      # total function count; deploying the full list unconditionally
      # (tried once, see git history) fails outright with "Max number of
      # functions reached for project" before anything lands, even for a
      # one-line change to a single function. This also means a genuinely
      # new function directory needs deploying once by hand the first time
      # (same as any project running near its plan limit).
      # Three consecutive deploys reported success on a commit that adds a
      # build marker, and the marker was absent from the live response every
      # time, while a config.toml change in the same window did take effect.
      # The project ref is a secret, so every log line naming it is masked as
      # ***, which makes "deployed to the wrong project" indistinguishable
      # from "deployed to the right one" by reading the log. Comparing it to
      # the ref the app itself uses (supabase/config.toml, .env.local and the
      # OTA manifest URL all agree on fjkkcrmhptrzobajjsqg) answers that
      # without printing the value: MATCH and MISMATCH are not secrets.
      # The deploy target follows supabase/config.toml, not the secret.
      #
      # secrets.SUPABASE_PROJECT_REF pointed at a different project than the
      # one the app talks to, so every edge function deployed from this
      # workflow landed somewhere the app never calls. The job still reported
      # success, the CLI still printed "Deployed Functions on project ***"
      # with the ref masked, and the running navi-chat kept serving whatever
      # code it had before — which is why a long series of fixes to it changed
      # nothing observable, and why navi_chat_diagnostics stayed empty no
      # matter how the instrumentation was rewritten.
      #
      # config.toml is version-controlled, is already what the Supabase CLI
      # treats as the source of truth for this project, and agrees with
      # .env.local and the OTA manifest URL. Deriving the ref from it means
      # this cannot silently drift again, and a wrong value shows up in a
      # diff rather than in a masked log line. The secret remains a fallback
      # for the case where config.toml has no project_id.
      - name: Resolve deploy target
        run: |
          set -euo pipefail
          ref="$(grep -m1 '^project_id' supabase/config.toml | cut -d'"' -f2 || true)"
          if [ -z "$ref" ]; then
            ref="${SUPABASE_PROJECT_REF:-}"
            echo "config.toml has no project_id; falling back to the secret."
          fi
          if [ -z "$ref" ]; then
            echo "No project ref available from config.toml or secrets." >&2
            exit 1
          fi
          echo "Deploy target: $ref"
          echo "DEPLOY_REF=$ref" >> "$GITHUB_ENV"

          # Fail here, with the reason, rather than deep inside the CLI.
          #
          # fjkkcrmhptrzobajjsqg is provisioned by Lovable and lives in a
          # Lovable-owned Supabase organisation. SUPABASE_ACCESS_TOKEN belongs
          # to the operator's own account, which is not a member of that org,
          # so the management API answers 403 for it. No token the operator can
          # generate from their own dashboard will change that.
          #
          # Deploys to this project have to go through Lovable, which owns it:
          # ask the Lovable agent for the project to deploy the function, or
          # use the supabase--deploy_edge_functions tool against project
          # 8fada453-44c4-4213-a8f4-afbeaf21de89.
          if ! supabase functions list --project-ref "$ref" >/dev/null 2>&1; then
            echo "::error::SUPABASE_ACCESS_TOKEN cannot access $ref (403). This project is Lovable-owned, so CI cannot deploy to it — deploy through Lovable instead. Failing now rather than deploying somewhere the app never calls."
            exit 1
          fi
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Deploy changed edge functions
        run: |
          set -euo pipefail
          before_sha="${{ github.event.before }}"
          if [ -z "$before_sha" ] || ! git cat-file -e "$before_sha" 2>/dev/null; then
            before_sha="HEAD~1"
          fi
          changed_dirs=$(git diff --name-only "$before_sha" HEAD -- 'supabase/functions/*/**' \
            | cut -d/ -f1-3 | sort -u)
          manual="${{ github.event.inputs.functions }}"
          if [ -n "$manual" ]; then
            changed_dirs=""
            for fn in $(echo "$manual" | tr ',' ' '); do
              changed_dirs="$changed_dirs supabase/functions/$fn"
            done
            echo "Manual deploy requested: $manual"
          fi
          if [ -z "$changed_dirs" ]; then
            echo "No edge function files changed in this push."
            exit 0
          fi
          for dir in $changed_dirs; do
            fn="$(basename "$dir")"
            if [ "$fn" = "_shared" ]; then continue; fi
            echo "::group::Deploy $fn"
            supabase functions deploy "$fn" --project-ref "$DEPLOY_REF"
            echo "::endgroup::"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
